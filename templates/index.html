<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlacidWay ITC Knowledge Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <img class="logo" src="/static/placidway-logo.png" alt="PlacidWay">
      <div>
        <h1>Knowledge Chatbot</h1>
        <p class="sub">Grounded in PlacidWay pages · ITC Immunity Therapy Center, Tijuana · Not medical advice</p>
      </div>
    </div>
  </header>
  <main>
    <div id="log" aria-live="polite"></div>
    <div class="suggest">
      <button class="chip" data-q="How much does adenocarcinoma cancer treatment cost in Tijuana?">Cost of treatment</button>
      <button class="chip" data-q="What is included in the adrenal cancer treatment package?">What's included</button>
      <button class="chip" data-q="Is alternative cancer treatment cheaper in Tijuana or in the USA?">Tijuana vs USA</button>
    </div>
    <form id="form">
      <input id="input" type="text" autocomplete="off" placeholder="Ask about packages, prices, inclusions…" required>
      <button type="submit">Send</button>
    </form>
    <div class="sources" id="sources"></div>
  </main>
  <script>
    const log = document.getElementById('log'), form = document.getElementById('form'),
          input = document.getElementById('input'), srcEl = document.getElementById('sources');
    let history = [];

    add('bot', 'Hello! Ask me about the ITC alternative cancer treatment packages in Tijuana, prices, or what\'s included.');
    document.querySelectorAll('.chip').forEach(c =>
      c.addEventListener('click', () => send(c.dataset.q)));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      send(input.value.trim());
    });

    async function send(message) {
      if (!message) return;
      input.value = '';
      add('user', message);
      const res = await fetch('/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message, history: history.slice(-6)})});
      const data = await res.json();
      add('bot', data.answer || 'Sorry, something went wrong.', data.disclaimer);
      if (data.sources && data.sources.length) {
        const uniq = [...new Set(data.sources.map(s => s.url))];
        srcEl.innerHTML = 'Sources: ' + uniq.map(u =>
          '<a href="' + u + '" target="_blank" rel="noopener">' + u.replace(/^https?:\/\/[^/]+\//, '…/') + '</a>'
        ).join('  ·  ');
      }
      history.push({role: 'user', content: message}, {role: 'assistant', content: data.answer});
    }

    function add(who, text, disclaimer) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.innerHTML = render(text);
      log.appendChild(d);
      if (disclaimer) {
        const dd = document.createElement('div');
        dd.className = 'disclaimer';
        dd.textContent = disclaimer;
        d.appendChild(dd);
      }
      log.scrollTop = log.scrollHeight;
    }

    function render(t) {
      return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*/g, '')
        .replace(/\[source:\s*(https?:\/\/[^\s\]]+)\]/g, ' <a href="$1" target="_blank" rel="noopener">$1</a>')
        .replace(/(?<![="])https?:\/\/[^\s<"'\]]+/g, '<a href="$&" target="_blank" rel="noopener">$&</a>')
        .replace(/^([*•-] .*)$/gm, '· $1')
        .replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
